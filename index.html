<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats preview card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">

      <div class="card__content">
        <header class="card__header">
          <h1 class="card__title">
            Get <span class="card__highlight">insights</span> that help your business grow.
          </h1>
          <p class="card__text">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
        </header>

        <ul class="stats">
          <li class="stats__item">
            <strong class="stats__value">10k+</strong>
            <span class="stats__label">Companies</span>
          </li>
          <li class="stats__item">
            <strong class="stats__value">314</strong>
            <span class="stats__label">Templates</span>
          </li>
          <li class="stats__item">
            <strong class="stats__value">12M+</strong>
            <span class="stats__label">Queries</span>
          </li>
        </ul>
      </div>

      <div class="card__media">
        <picture>
          <source media="(min-width: 900px)" srcset="images/image-header-desktop.jpg">
          <img
            class="card__image"
            src="images/image-header-mobile.jpg"
            alt="Team of people working together around a table with a laptop">
        </picture>
      </div>

    </section>
  </main>
</body>
</html>
